[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-indexer"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "mcp>=2.0",
    "sqlalchemy>=2.0",
    "watchdog>=3.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
cbi = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
preview = true
force-exclude = true
extend-exclude = ["tests/fixtures", ".agents", "src/ui"]

[tool.ruff.lint]
explicit-preview-rules = true
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RET", "PLC0415"]

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "tests/fixtures",
    ".agents",
    "venv",
    "src/ui",
    "**/__pycache__",
]
extraPaths = ["src"]
venvPath = "."
venv = "venv"
typeCheckingMode = "standard"
reportMissingParameterType = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportDeprecated = "error"
