[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-indexer"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "mcp>=2.0",
    "sqlalchemy>=2.0",
    "watchdog>=3.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
cbi = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
preview = true
extend-exclude = ["tests/fixtures", ".agents", "src/ui"]

[tool.ruff.lint]
explicit-preview-rules = true
select = [
    # PEP 8 & Hygiene
    "E", "W",
    "N",
    "I",
    "F",
    "PLC0415",

    # Function Size & Single Responsibility
    "C90",
    "PLR0915",
    "PLR0912",
    "PLR0911",
    "PLR0913",
    "PLR0914",
    "PLR1702",

    # Readability & Flat Control Flow
    "SIM",
    "RET",
    "C4",
    "B",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 35
max-branches = 8
max-returns = 5
max-args = 6
max-locals = 12
max-nested-blocks = 3

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR0913", "PLR0914", "PLR0915"]

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "tests/fixtures",
    ".agents",
    "venv",
    "src/ui",
    "**/__pycache__",
]
extraPaths = ["src"]
venvPath = "."
venv = "venv"
typeCheckingMode = "standard"
reportMissingParameterType = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportDeprecated = "error"
